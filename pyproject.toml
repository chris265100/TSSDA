[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tssda"
version = "0.1.0"
description = "Skill-based time-series SQL and natural-language data generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.30.0", "PyYAML>=6.0", "apache-iotdb>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tssda = "run_tssda:main"

[tool.setuptools]
py-modules = ["run_tssda"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tssda*", "skills*", "iotdb_tools*"]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.package-data]
tssda = ["*.md", "knowledge/*.md"]
"*" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
